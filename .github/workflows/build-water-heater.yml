name: Build Water Heater Docker Image

on:
  push:
    branches:
      - water_heater
      - water_heater-docker
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build ESPHome ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            os: "ubuntu-24.04"
          - arch: arm64
            os: "ubuntu-24.04-arm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: final
          platforms: ${{ matrix.platform.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:water_heater-${{ matrix.platform.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=docker
            BUILD_VERSION=water_heater
            BUILD_OS=debian

  create-manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:water_heater \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:water_heater-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:water_heater-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:water_heater
